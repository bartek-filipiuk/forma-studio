[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forma-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.11,<3",
 "pydantic-settings>=2.8,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.15,<2",
 "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6", "boto3>=1.37,<2",
 "argon2-cffi>=25.1,<26", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "cadquery==2.7.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
[tool.setuptools.packages.find]
include = ["forma*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
